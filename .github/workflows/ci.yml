name: BloodLink CI — Automated Build & TDD Coverage Pipeline

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Run Vitest TDD Suite & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Unit Tests & Coverage Report (TDD + Mocks)
        run: npm run test:coverage

      - name: Verify Production Application Build
        run: npm run build

